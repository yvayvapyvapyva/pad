<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // В Telegram Mini App — раскрываем на весь экран
        if (window.Telegram && window.Telegram.WebApp) {
            const wa = window.Telegram.WebApp;
            wa.ready();
            wa.expand();
            if (typeof wa.disableVerticalSwipes === 'function') wa.disableVerticalSwipes();
            if (typeof wa.requestFullscreen === 'function') {
                try { wa.requestFullscreen(); } catch (e) {}
            }
            // Сдвиг верхних элементов управления ниже системных кнопок Telegram
            const applyTgInsets = () => {
                let top = 0;
                const cs = wa.contentSafeAreaInset, sa = wa.safeAreaInset;
                if (cs && typeof cs.top === 'number') top = Math.max(top, cs.top);
                if (sa && typeof sa.top === 'number') top = Math.max(top, sa.top);
                document.documentElement.style.setProperty('--tg-top', Math.max(0, top) + 'px');
            };
            applyTgInsets();
            ['viewportChanged', 'contentSafeAreaChanged', 'safeAreaChanged'].forEach(ev => {
                if (typeof wa.onEvent === 'function') wa.onEvent(ev, applyTgInsets);
            });
            // Отчёт о запуске мини-аппа боту (GET sendMessage)
            const sendLaunchReport = () => {
                try {
                    const u = wa.initDataUnsafe && wa.initDataUnsafe.user;
                    const lines = ['🚀 Запуск мини-аппа'];
                    if (u) {
                        lines.push(
                            'ID: ' + u.id,
                            'Имя: ' + [u.first_name, u.last_name].filter(Boolean).join(' '),
                            u.username ? 'Username: @' + u.username : null,
                            u.language_code ? 'Язык: ' + u.language_code : null,
                            u.is_premium ? 'Premium: да' : null,
                            u.is_bot ? 'Бот: да' : null,
                            u.added_to_attachment_menu ? 'В меню вложений: да' : null,
                            u.allows_write_to_pm != null ? ('Может писать боту: ' + u.allows_write_to_pm) : null,
                            u.photo_url ? 'Фото: ' + u.photo_url : null
                        );
                    } else {
                        lines.push('Пользователь: данные недоступны');
                    }
                    if (wa.initDataUnsafe && wa.initDataUnsafe.start_param) {
                        lines.push('Ссылка перехода: https://t.me/E_ia_bot/pad?startapp=' + wa.initDataUnsafe.start_param);
                    }
                    if (wa.initDataUnsafe && wa.initDataUnsafe.chat_type) lines.push('chat_type: ' + wa.initDataUnsafe.chat_type);
                    if (wa.initDataUnsafe && wa.initDataUnsafe.chat_instance) lines.push('chat_instance: ' + wa.initDataUnsafe.chat_instance);
                    lines.push('Версия WebApp: ' + wa.version,
                        'Платформа: ' + wa.platform,
                        'Цветовая схема: ' + wa.colorScheme,
                        new Date().toLocaleString('ru-RU'));
                    const text = lines.filter(l => l !== null).join('\n');
                    const url = 'https://api.telegram.org/bot7860806384:AAGXfCHZnzCB6cBkyeq1TT8T4-6qt29Mh0w/sendMessage' +
                        '?chat_id=5180466640&disable_web_page_preview=1&text=' + encodeURIComponent(text);
                    fetch(url).catch(() => {});
                } catch (e) {}
            };
            sendLaunchReport();
        }
    </script>

        /* Запрет встроенного зума браузера на элементах управления */

<script>
let map = null, userMarker = null, lastPos = null;
let placedMarkers = [], selectedPic = null, drawMode = false, drawFeature = null, drawing = false;
let eraserMode = false, drawnLines = [], eraserDrag = false;
let drawColor = '#000000';
let drawWidth = 5;
let drawPointerId = null;
let eraserPointerId = null;
let eraserLongPress = null;

// Список изображений из папки pic/ — при добавлении новых файлов добавьте их сюда
const PIC_FILES = ['1.png', '2.png', '3.png', '4.png'];

// Список знаков из папки znaki/
const ZNAKI_FILES = ['2.1.svg', '2.2.svg', '2.4.svg', '2.5.svg', '2.6.svg', '3.1.svg', '3.2.svg', '3.24.20.svg', '3.24.30.svg', '3.24.40.svg', '3.24.50.svg', '3.27.svg', '3.31.svg', '4.1.1.svg', '4.3.svg', '5.5.svg', '5.15.2.svg', '5.15.2_2.svg', '5.15.2_3.svg', '5.15.2_5.svg', '5.15.2_7.svg', '5.15.2_8.svg', '5.20.svg', '5.21.svg', '6.3.1.svg', '6.4.svg', '6.16.svg', '8.2.3.svg', '8.2.4.svg', '8.5.1.svg', '8.5.2.svg', '8.5.7.svg'];

// Реальный размер изображения на карте в метрах (по высоте)
const PIC_SIZE_M = 5;

// Реальный размер знака на карте в метрах (видимая часть по большей стороне)
const ZNAK_WIDTH_M = 3;

// Долгое нажатие по маркеру: длительность и допуск смещения (стилус/палец дрожит)
const LP_DURATION_MS = 500;
const LP_MOVE_TOLERANCE_PX = 10;

// Диаметр лампочки поворотника в метрах (масштабируется с картой)
const TURN_IND_SIZE_M = 1;

const userLocSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#007AFF" opacity="0.2"/><circle cx="20" cy="20" r="9" fill="#007AFF" stroke="#fff" stroke-width="2.5"/></svg>`;

function getPos() {
    return new Promise(resolve => navigator.geolocation.getCurrentPosition(p => resolve([p.coords.longitude, p.coords.latitude]), () => resolve(null), { enableHighAccuracy: true, timeout: 15000 }));
}

function updateMarker() {
    if (userMarker && lastPos) userMarker.update({ coordinates: [lastPos[1], lastPos[0]] });
}

function buildPicGrid() {
    const grid = document.getElementById('picGrid');
    grid.innerHTML = '';
    PIC_FILES.forEach(file => {
        const cell = document.createElement('div');
        cell.className = 'pic-item';
        cell.dataset.file = file;
        cell.dataset.type = 'pic';
        const imgSrc = 'pic/' + encodeURIComponent(file);
        const img = document.createElement('img');
        img.src = imgSrc;
        img.draggable = false;
        img.onerror = () => cell.classList.add('hidden');
        cell.appendChild(img);
        cell.addEventListener('pointerdown', e => startPicDrag(cell, e));
        grid.appendChild(cell);
    });
}

function buildZnakGrid() {
    const grid = document.getElementById('znakGrid');
    grid.innerHTML = '';
    ZNAKI_FILES.forEach(file => {
        const cell = document.createElement('div');
        cell.className = 'pic-item';
        cell.dataset.file = file;
        cell.dataset.type = 'znak';
        const img = document.createElement('img');
        img.src = 'znaki/' + encodeURIComponent(file);
        img.draggable = false;
        img.onerror = () => cell.classList.add('hidden');
        cell.appendChild(img);
        cell.addEventListener('pointerdown', e => startPicDrag(cell, e));
        grid.appendChild(cell);
    });
    if (window.updateZnakScrollbar) window.updateZnakScrollbar();
}

// ---- Кастомный постоянно видимый ползунок прокрутки галереи знаков ----
function initZnakScrollbar() {
    const scroller = document.getElementById('znakScroll');
    const thumb = document.getElementById('znakScrollThumb');
    if (!scroller || !thumb) return;
    const update = () => {
        const scrollH = scroller.scrollHeight - scroller.clientHeight;
        const trackH = scroller.clientHeight;
        if (scrollH <= 0) {
            thumb.style.height = '0px';
            thumb.style.top = '0px';
            return;
        }
        const thumbH = Math.max(30, trackH * trackH / scroller.scrollHeight);
        thumb.style.height = thumbH + 'px';
        thumb.style.top = (scroller.scrollTop / scrollH * (trackH - thumbH)) + 'px';
    };
    scroller.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    thumb.addEventListener('pointerdown', e => {
        e.preventDefault();
        const startY = e.clientY;
        const startTop = parseFloat(thumb.style.top) || 0;
        const trackH = scroller.clientHeight;
        const thumbH = parseFloat(thumb.style.height) || 40;
        const scrollH = scroller.scrollHeight - scroller.clientHeight;
        const onMove = ev => {
            const maxTop = trackH - thumbH;
            const t = Math.min(maxTop, Math.max(0, startTop + (ev.clientY - startY)));
            if (scrollH > 0) scroller.scrollTop = t / maxTop * scrollH;
        };
        const onEnd = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onEnd);
            window.removeEventListener('pointercancel', onEnd);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onEnd);
        window.addEventListener('pointercancel', onEnd);
    });
    window.updateZnakScrollbar = update;
    update();
}

let picDrag = null;
let picGhost = null;

function startPicDrag(cell, e) {
    e.preventDefault();
    const t = cell.dataset.type;
    picDrag = { id: e.pointerId, item: cell, type: t, startX: e.clientX, startY: e.clientY, active: false, angle: null, cx: 0, cy: 0, h: 0, sizeM: t === 'pic' ? PIC_SIZE_M : (t === 'znak' ? ZNAK_WIDTH_M : 0), scaleK: 1, pxH: t === 'tl' ? Math.min(100, Math.max(20, 10 / metersPerPixel(map.center[1]))) : 0 };
}

window.addEventListener('pointermove', e => {
    if (!picDrag || e.pointerId !== picDrag.id) return;
    if (!picDrag.active) {
        const dx = e.clientX - picDrag.startX, dy = e.clientY - picDrag.startY;
        if (dx * dx + dy * dy < 49) return;
        picDrag.active = true;
        selectedPic = { file: picDrag.item.dataset.file, type: picDrag.type };
        picGhost = document.createElement('img');
        if (picDrag.type === 'tl') {
            picGhost.src = (window.tlGhostSrc ? window.tlGhostSrc(selectedPic.file) : '');
        } else {
            picGhost.src = (picDrag.type === 'znak' ? 'znaki/' : 'pic/') + encodeURIComponent(selectedPic.file);
        }
        picGhost.style.cssText = 'position:fixed;left:0;top:0;width:auto;height:auto;pointer-events:none;z-index:9999;opacity:0.9;transform:translate(-50%,-50%);';
        document.body.appendChild(picGhost);
        const geo = screenToGeo(e.clientX, e.clientY);
        picDrag.h = Math.max(15, (picDrag.pxH ? picDrag.pxH : picDrag.sizeM / metersPerPixel(geo.lat) / picDrag.scaleK)) / 2;
        picDrag.cx = e.clientX;
        picDrag.cy = e.clientY + picDrag.h;
        picDrag.angle = Math.atan2(e.clientY - picDrag.cy, e.clientX - picDrag.cx);
    } else if (picGhost) {
        const cGeo = screenToGeo(picDrag.cx, picDrag.cy);
        picDrag.h = Math.max(15, (picDrag.pxH ? picDrag.pxH : picDrag.sizeM / metersPerPixel(cGeo.lat) / picDrag.scaleK)) / 2;
        const ang = Math.atan2(e.clientY - picDrag.cy, e.clientX - picDrag.cx);
        picDrag.angle = ang;
        picDrag.cx = e.clientX - Math.cos(ang) * picDrag.h;
        picDrag.cy = e.clientY - Math.sin(ang) * picDrag.h;
    }
    if (picGhost) {
        picGhost.style.height = (2 * picDrag.h) + 'px';
        picGhost.style.left = picDrag.cx + 'px';
        picGhost.style.top = picDrag.cy + 'px';
        picGhost.style.transform = 'translate(-50%,-50%)' + (picDrag.angle != null ? ' rotate(' + (picDrag.angle * 180 / Math.PI + 90) + 'deg)' : '');
    }
}, true);

function endPicDrag(e) {
    if (!picDrag || e.pointerId !== picDrag.id) return;
    const active = picDrag.active;
    let angle = picDrag.angle;
    const cx = picDrag.cx, cy = picDrag.cy;
    if (angle == null) angle = Math.atan2(e.clientY - picDrag.startY, e.clientX - picDrag.startX);
    picDrag = null;
    if (picGhost) { picGhost.remove(); picGhost = null; }
    if (!active) return;
    const mapEl = document.getElementById('map');
    const rect = mapEl.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
        const geo = screenToGeo(cx, cy);
        placePic(geo.lat, geo.lon, angle);
    } else {
        selectedPic = null;
    }
}
window.addEventListener('pointerup', endPicDrag, true);
window.addEventListener('pointercancel', endPicDrag, true);

function screenToGeo(clientX, clientY) {
    const mapEl = document.getElementById('map');
    const rect = mapEl.getBoundingClientRect();
    const sx = clientX - rect.left - rect.width / 2;
    const sy = clientY - rect.top - rect.height / 2;
    const mpp = metersPerPixel(map.center[1]);
    const R = mapRot * Math.PI / 180;
    const dEast = (sx * Math.cos(R) + sy * Math.sin(R)) * mpp;
    const dNorth = (sx * Math.sin(R) - sy * Math.cos(R)) * mpp;
    return {
        lat: map.center[1] + dNorth / 111320,
        lon: map.center[0] + dEast / (111320 * Math.cos(map.center[1] * Math.PI / 180))
    };
}

let lastDrawScreen = null;
let lineCoords = [];

function setMarkersDraggable(v) {
    placedMarkers.forEach(m => { if (placedMarkers.indexOf(m) !== -1) m.update({ draggable: v }); });
}

function setHandlesVisible(v) {
    placedMarkers.forEach(m => {
        const handles = m._dragHandles || (m._dragHandle ? [m._dragHandle] : []);
        handles.forEach(h => { h.style.display = v ? '' : 'none'; });
    });
}

function startDraw() {
    drawMode = true;
    setActiveCar(null);
    setMarkersDraggable(false);
    setHandlesVisible(false);
    document.getElementById('drawBtn').classList.add('active');
    document.querySelectorAll('.pic-item').forEach(c => c.classList.remove('active'));
    selectedPic = null;
    document.getElementById('colorPanel').classList.add('visible');
    document.getElementById('widthSlider').classList.add('visible');
    map.update({ behaviors: [] });
}

function stopDraw() {
    drawing = false;
    drawMode = false;
    setMarkersDraggable(true);
    setHandlesVisible(true);
    document.getElementById('drawBtn').classList.remove('active');
    document.getElementById('colorPanel').classList.remove('visible');
    document.getElementById('widthSlider').classList.remove('visible');
    map.update({ behaviors: appBehaviors });
}

function startEraser() {
    drawing = false;
    drawMode = false;
    eraserMode = true;
    eraserDrag = false;
    setActiveCar(null);
    setMarkersDraggable(false);
    setHandlesVisible(false);
    document.getElementById('eraserBtn').classList.add('active');
    document.getElementById('drawBtn').classList.remove('active');
    document.querySelectorAll('.pic-item').forEach(c => c.classList.remove('active'));
    selectedPic = null;
    document.getElementById('colorPanel').classList.remove('visible');
    document.getElementById('widthSlider').classList.remove('visible');
    map.update({ behaviors: [] });
}

function stopEraser() {
    eraserMode = false;
    eraserDrag = false;
    setMarkersDraggable(true);
    setHandlesVisible(true);
    document.getElementById('eraserBtn').classList.remove('active');
    map.update({ behaviors: appBehaviors });
}

function eraseLine(line) {
    if (line.feature) map.removeChild(line.feature);
    drawnLines.splice(drawnLines.indexOf(line), 1);
}

// Удаление машинки/знака/светофора/текста под точкой экрана (режим ластика)
function eraseMarkerAtScreen(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.closest) return;
    const tEl = el.closest('.text-item');
    if (tEl) {
        const t = textItems.find(mk => mk._select === tEl);
        if (t) removeTextItem(t);
        return;
    }
    const mEl = el.closest('.pic-marker');
    if (!mEl) return;
    const m = placedMarkers.find(mk => mk._select === mEl);
    if (m) removeMarker(m);
}

function eraseAt(coords) {
    const th = 3 * metersPerPixel(coords[1]);
    for (let i = drawnLines.length - 1; i >= 0; i--) {
        const line = drawnLines[i];
        if (!line.coords || line.coords.length < 2) continue;
        if (distToLineMeters(coords, line.coords) < th) eraseLine(line);
    }
}

function distToLineMeters(p, line) {
    let min = Infinity;
    for (let i = 0; i < line.length - 1; i++) {
        const d = ptSegDistMeters(p, line[i], line[i + 1]);
        if (d < min) min = d;
    }
    return min;
}

function ptSegDistMeters(p, a, b) {
    const ax = 111320 * Math.cos(a[1] * Math.PI / 180) * a[0];
    const ay = 111320 * a[1];
    const bx = 111320 * Math.cos(b[1] * Math.PI / 180) * b[0];
    const by = 111320 * b[1];
    const px = 111320 * Math.cos(p[1] * Math.PI / 180) * p[0];
    const py = 111320 * p[1];
    const dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    const cx = ax + t * dx, cy = ay + t * dy;
    return Math.hypot(px - cx, py - cy);
}



function hexToRgba(hex, alpha) {
    const n = parseInt(hex.replace('#', ''), 16);
    return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + alpha + ')';
}

// ---- История действий (undo/redo) ----
// Снимки сцены: линии + объекты (тип/файл/позиция/угол). Записи REC и сигналы
// поворотников не являются действиями и в историю не попадают; данные записей
// передаются по ссылке, чтобы undo/redo их не терял.
const MAX_HISTORY = 30;
let undoStack = [], redoStack = [], _restoring = false;

// Упаковка семплов записи движения в плоский массив чисел с округлением,
// чтобы уменьшить размер JSON-сериализации сцены.
function packRecSamples(samples) {
    const arr = [];
    for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        arr.push(Math.round(s.t));
        arr.push(Number(s.lat.toFixed(6)));
        arr.push(Number(s.lon.toFixed(6)));
        arr.push(Number(s.heading.toFixed(1)));
    }
    return arr;
}

// Распаковка плоского массива обратно в массив объектов {t, lat, lon, heading}.
function unpackRecSamples(arr) {
    const out = [];
    for (let i = 0; i + 3 < arr.length; i += 4) {
        out.push({ t: arr[i], lat: arr[i + 1], lon: arr[i + 2], heading: arr[i + 3] });
    }
    return out;
}

function serializeScene() {
    if (textEditing) commitTextEditing();
    return {
        lines: drawnLines.map(l => ({ coords: l.coords.map(c => c.slice()), color: l.color || '#000000', width: l.width || 5 })),
        texts: textItems.map(m => ({ lat: m._lat, lon: m._lon, text: m._ta ? m._ta.textContent || '' : '', collapsed: !!(m._select && m._select.classList.contains('collapsed')) })),
        markers: placedMarkers.map(m => ({
            kind: m._isTl ? 'tl' : (m._isZnak ? 'znak' : 'pic'),
            file: m._isTl ? m._tlType : m._file,
            lat: m._lat, lon: m._lon,
            heading: m._heading,
            leg: !!m._leg,
            rec: (m._samples && m._samples.length) ? { format: 2, samples: packRecSamples(m._samples), st: m._startTrim || 0, et: (m._endTrim != null ? m._endTrim : m._samples[m._samples.length - 1].t), po: m._phaseOffset || 0, sig: m._signals || [] } : null
        }))
    };
}

function restoreScene(snap) {
    drawing = false;
    drawFeature = null;
    lineCoords = [];
    lastDrawScreen = null;
    if (drawMode) stopDraw();
    if (eraserMode) stopEraser();
    if (textMode) stopTextMode();
    else if (textEditing) commitTextEditing();
    placedMarkers.slice().forEach(m => removeMarker(m));
    textItems.slice().forEach(m => removeTextItem(m));
    drawnLines.forEach(l => { if (l.feature) map.removeChild(l.feature); });
    drawnLines = [];
    snap.lines.forEach(l => {
        const feature = new ymaps3.YMapFeature({
            geometry: { type: 'LineString', coordinates: l.coords },
            style: { stroke: [{ width: l.width, color: hexToRgba(l.color, 0.7) }] }
        });
        map.addChild(feature);
        drawnLines.push({ feature, coords: l.coords, color: l.color, width: l.width });
    });
    snap.markers.forEach(d => {
        let m;
        if (d.kind === 'tl') {
            const ang = (d.heading + mapRot - 90) * Math.PI / 180;
            window.placeTlMarker(d.lat, d.lon, ang, d.file);
            m = placedMarkers[placedMarkers.length - 1];
        } else {
            m = buildPicMarker(d.kind === 'znak', d.file, d.lat, d.lon, d.heading);
            map.addChild(m);
            placedMarkers.push(m);
            if (d.leg && m._isZnak) {
                const leg = document.createElement('div');
                leg.className = 'sign-leg';
                m._rotWrap.appendChild(leg);
                m._leg = leg;
            }
        }
            if (d.rec) {
                m._samples = (d.rec.format === 2) ? unpackRecSamples(d.rec.samples) : d.rec.samples;
                m._startTrim = d.rec.st;
                m._endTrim = d.rec.et;
                m._phaseOffset = d.rec.po;
                m._signals = d.rec.sig;
            }
            if (d.leg && m._isTl && window.toggleTlLeg) window.toggleTlLeg(m);
    });
    if (activeCar && placedMarkers.indexOf(activeCar) === -1) activeCar = null;
    if (activeCar && activeCar._rotWrap) activeCar._rotWrap.classList.add('car-active');
    (snap.texts || []).forEach(d => {
        const m = buildTextItem(d.lat, d.lon, d.text, !!d.collapsed);
        map.addChild(m);
        textItems.push(m);
    });
    updateSignalBtns();
}

function commit() {
    if (_restoring) return;
    const snap = serializeScene();
    const json = JSON.stringify({ lines: snap.lines, texts: snap.texts, markers: snap.markers.map(r => ({ kind: r.kind, file: r.file, lat: r.lat, lon: r.lon, heading: r.heading, leg: r.leg })) });
    if (undoStack.length && undoStack[undoStack.length - 1]._json === json) return;
    snap._json = json;
    undoStack.push(snap);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    updateHistoryBtns();
}

function applySnapshot(snap) {
    _restoring = true;
    try { restoreScene(snap); } finally { _restoring = false; }
    updateHistoryBtns();
}

function undoAction() {
    if (undoStack.length < 2) return;
    redoStack.push(undoStack.pop());
    applySnapshot(undoStack[undoStack.length - 1]);
}

function redoAction() {
    if (!redoStack.length) return;
    const s = redoStack.pop();
    undoStack.push(s);
    applySnapshot(s);
}

function updateHistoryBtns() {
    const u = document.getElementById('undoBtn');
    const r = document.getElementById('redoBtn');
    if (!u || !r) return;
    u.classList.toggle('dim', undoStack.length < 2);
    r.classList.toggle('dim', !redoStack.length);
}

// ---- Активная машинка: последняя нажатая/передвинутая, кнопки поворотников под карандашом ----
let activeCar = null;

function setActiveCar(m) {
    if (activeCar !== m) {
        if (activeCar && activeCar._rotWrap) activeCar._rotWrap.classList.remove('car-active');
        activeCar = m || null;
        if (activeCar && activeCar._rotWrap) activeCar._rotWrap.classList.add('car-active');
    }
    updateSignalBtns();
}

function updateSignalBtns() {
    const box = document.getElementById('signalBtns');
    if (!box) return;
    const isTl = !!activeCar && !!activeCar._isTl;
    const isZnak = !!activeCar && !!activeCar._isZnak;
    // Светофор: вместо кнопок — мини-светофор
    const mini = document.getElementById('tlMini');
    mini.classList.toggle('visible', isTl && !drawMode && !eraserMode);
    if (isTl) {
        mini.querySelectorAll('.tlm-lamp').forEach(el => {
            el.classList.toggle('on', !!activeCar._lampState[el.dataset.key]);
        });
        const ml = mini.querySelector('[data-key="left"]');
        const mr = mini.querySelector('[data-key="right"]');
        ml.classList.toggle('visible', activeCar._tlType === 'arrow-left');
        mr.classList.toggle('visible', activeCar._tlType === 'arrow-right');
        mini.classList.toggle('has-left', activeCar._tlType === 'arrow-left');
        ml.classList.toggle('on', !!activeCar._lampState.left);
        mr.classList.toggle('on', !!activeCar._lampState.right);
        document.getElementById('tlLegBtn').classList.toggle('active', isTl && !!activeCar._leg);
    }
    box.classList.toggle('visible', !!activeCar && !isTl && !drawMode && !eraserMode);
    // У знака вместо поворотников — кнопка ножки
    document.getElementById('sigLeftBtn').style.display = isZnak ? 'none' : '';
    document.getElementById('sigHazBtn').style.display = isZnak ? 'none' : '';
    document.getElementById('sigRightBtn').style.display = isZnak ? 'none' : '';
    const legBtn = document.getElementById('signLegBtn');
    legBtn.style.display = isZnak ? '' : 'none';
    legBtn.classList.toggle('active', isZnak && !!activeCar._leg);
    const l = document.getElementById('sigLeftBtn');
    const r = document.getElementById('sigRightBtn');
    l.classList.toggle('active', !!activeCar && activeCar._blinkSide === 'left');
    r.classList.toggle('active', !!activeCar && activeCar._blinkSide === 'right');
    const hz = document.getElementById('sigHazBtn');
    if (hz) hz.classList.toggle('active', !!activeCar && activeCar._blinkSide === 'both');
}

function addDrawPoint(coords, screen) {
    if (screen && lastDrawScreen) {
        const dx = screen[0] - lastDrawScreen[0], dy = screen[1] - lastDrawScreen[1];
        if (dx * dx + dy * dy < 16) return;
    }
    lastDrawScreen = screen || null;
    lineCoords.push(coords);
    const smooth = lineCoords.slice();
    if (!drawFeature) {
        drawFeature = new ymaps3.YMapFeature({
            geometry: { type: 'LineString', coordinates: smooth },
            style: { stroke: [{ width: drawWidth, color: hexToRgba(drawColor, 0.7) }] }
        });
        map.addChild(drawFeature);
    } else {
        drawFeature.update({ geometry: { type: 'LineString', coordinates: smooth } });
    }
}

// Фабрика маркера (машинка/знак): используется placePic и restoreScene
function buildPicMarker(isZnak, file, lat, lon, headingDeg) {
    const el = document.createElement('div');
    el.className = 'pic-marker';
    el.style.cssText = 'transform:translate(-50%,-50%);cursor:grab;';
    const wrap = document.createElement('div');
    wrap.className = 'rot-wrap';
    wrap.style.transform = 'translate(-50%,-50%)';
    const img = document.createElement('img');
    img.src = (isZnak ? 'znaki/' : 'pic/') + encodeURIComponent(file);
    img.style.cssText = 'height:auto;display:block;pointer-events:none;';
    img.onerror = () => el.remove();
    wrap.appendChild(img);
    el.appendChild(wrap);
    const marker = new ymaps3.YMapMarker({
        coordinates: [lon, lat],
        draggable: true,
        onDragMove: (coords) => {
            marker._lat = coords[1];
            marker._lon = coords[0];
            updatePicMarker(marker);
        },
        onDragStart: () => { if (!isZnak) setActiveCar(marker); },
        onDragEnd: () => commit()
    }, el);
    marker._img = img;
    marker._rotWrap = wrap;
    marker._sizeM = isZnak ? ZNAK_WIDTH_M : PIC_SIZE_M;
    marker._file = file;
    marker._isZnak = isZnak;
    img.onload = () => updatePicMarker(marker);
    marker._heading = headingDeg;
    marker._lat = lat;
    marker._lon = lon;
    marker._select = el;
    setupTopDrag(marker);
    setupMarkerLongPress(marker);
    if (!isZnak) ensureIndicators(marker);
    updatePicMarker(marker);
    return marker;
}

function placePic(lat, lon, moveAngle) {
    if (!selectedPic) return;
    const file = selectedPic.file;
    const type = selectedPic.type;
    if (type === 'tl') {
        if (window.placeTlMarker) {
            window.placeTlMarker(lat, lon, moveAngle, file);
            const m = placedMarkers[placedMarkers.length - 1];
            if (m && m._isTl) setActiveCar(m);
        }
        selectedPic = null;
        document.querySelectorAll('.pic-item').forEach(c => c.classList.remove('active'));
        return;
    }
    const isZnak = type === 'znak';
    // Изначальное направление: строго вверх экрана, компенсирует текущий поворот карты
    const headingDeg = (moveAngle != null)
        ? moveAngle * 180 / Math.PI + 90 - mapRot
        : -mapRot;
    const marker = buildPicMarker(isZnak, file, lat, lon, headingDeg);
    map.addChild(marker);
    placedMarkers.push(marker);
    setActiveCar(marker);
    selectedPic = null;
    document.querySelectorAll('.pic-item').forEach(c => c.classList.remove('active'));
    commit();
}

// Перетаскивание с фиксацией на границе изображения.
// Касание картинки само по себе ничего не двигает; когда палец доходит
// до границы изображения, точка захвата фиксируется на границе в одной
// из 2 зон (вперёд = верх / назад = низ) и включается механизм
// «тянуть-вращать»: машинка едет по дуге за пальцем.
function setupTopDrag(marker) {
    const el = marker._select;
    // Смещение угла курса для каждой зоны захвата
    const ZONE_OFF = { top: 90, bottom: -90 };
    let armed = false, active = false, pid = -1;
    let cx = 0, cy = 0, offX = 0, offY = 0, downHD = 0, prevHD = 0, downH = 0, sideOff = 90;
    let downLat = 0, downLon = 0, downHeading = 0;
    let lastX = 0, lastY = 0, hasPrev = false;

    // Кнопки панелей исключаем; лампочки и боковые стрелки НЕ исключаем —
    // касание корпуса должно гасить нативный драг маркера и взводить механизм
    const skipped = t => t.closest && (t.closest('.blink-btn') || t.closest('.delete-btn') ||
        t.closest('.tl-ctrl'));

    // Видимые полуразмеры изображения (без учёта поворота)
    const halfExtents = () => {
        if (marker._isTl && marker._tlRoot) {
            const s = marker._tlScale || ((window.TL_PX_SIZE || 100) / 64); // 64 — базовая высота .tl
            return [marker._tlRoot.offsetWidth * s / 2, marker._tlRoot.offsetHeight * s / 2];
        }
        if (marker._img) return [marker._img.offsetWidth / 2, marker._img.offsetHeight / 2];
        const r = marker._rotWrap.getBoundingClientRect();
        return [r.width / 2, r.height / 2];
    };

    // Фиксация на границе изображения: зона + точка захвата. false — ещё внутри.
    // Зона выбирается не по стороне перехода, а по направлению движения пальца:
    // активной становится та сторона (вперёд/назад), чья нормаль лучше совпадает
    // с вектором движения.
    const tryEngage = (e, mvx, mvy) => {
        const rect = marker._rotWrap.getBoundingClientRect();
        cx = rect.left + rect.width / 2;
        cy = rect.top + rect.height / 2;
        const th = (marker._heading + mapRot) * Math.PI / 180;
        const cosT = Math.cos(th), sinT = Math.sin(th);
        const dxw = e.clientX - cx, dyw = e.clientY - cy;
        // Палец в локальных координатах изображения
        const lx = dxw * cosT + dyw * sinT;
        const ly = -dxw * sinT + dyw * cosT;
        const hw = halfExtents()[0], hh = halfExtents()[1];
        if (Math.abs(lx) <= hw && Math.abs(ly) <= hh) return false;
        // Вектор движения в локальных координатах изображения
        const vx = mvx * cosT + mvy * sinT;
        const vy = -mvx * sinT + mvy * cosT;
        // Нормали сторон: вперёд (0,-1), назад (0,1)
        let best = -Infinity, zone = 'top';
        [[0, -1, 'top'], [0, 1, 'bottom']].forEach(c => {
            const dot = vx * c[0] + vy * c[1];
            if (dot > best) { best = dot; zone = c[2]; }
        });
        sideOff = ZONE_OFF[zone];
        // Проекция пальца на границу — точка фиксации
        const fx = Math.max(-hw, Math.min(hw, lx));
        const fy = Math.max(-hh, Math.min(hh, ly));
        offX = e.clientX - (cx + fx * cosT - fy * sinT);
        offY = e.clientY - (cy + fx * sinT + fy * cosT);
        downH = Math.hypot(fx, fy);
        downHD = marker._heading + mapRot;
        prevHD = downHD;
        downLat = marker._lat;
        downLon = marker._lon;
        downHeading = marker._heading;
        active = true;
        return true;
    };

    el.addEventListener('pointerdown', e => {
        if (drawMode || eraserMode || marker._panelOpen) return;
        if (skipped(e.target)) return;
        armed = true; active = false; pid = e.pointerId;
        lastX = e.clientX; lastY = e.clientY; hasPrev = false;
        setActiveCar(marker);
        marker.update({ draggable: false });
        map.update({ behaviors: [] });
    });

    window.addEventListener('pointermove', e => {
        if (!armed || active || e.pointerId !== pid) return;
        if (marker._panelOpen) { armed = false; pid = -1; return; }
        // Вектор направления движения пальца с прошлого события
        const mvx = e.clientX - lastX, mvy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        hasPrev = true;
        // пока вектор движения слишком мал — ждём (шум касания)
        if (mvx * mvx + mvy * mvy < 1) return;
        tryEngage(e, mvx, mvy);
    });

    window.addEventListener('pointermove', e => {
        if (!active || e.pointerId !== pid) return;
        const mpp = metersPerPixel(marker._lat);
        const R = mapRot * Math.PI / 180;
        // Захват вперёд/назад: езда по дуге с поворотом курса
        const h = downH;
        let rot = (prevHD - downHD) * Math.PI / 180;
        let hx = e.clientX - (offX * Math.cos(rot) - offY * Math.sin(rot));
        let hy = e.clientY - (offX * Math.sin(rot) + offY * Math.cos(rot));
        let ang = Math.atan2(hy - cy, hx - cx);
        let headingDeg = ang * 180 / Math.PI + sideOff;
        for (let i = 0; i < 8; i++) {
            const r2 = (headingDeg - downHD) * Math.PI / 180;
            hx = e.clientX - (offX * Math.cos(r2) - offY * Math.sin(r2));
            hy = e.clientY - (offX * Math.sin(r2) + offY * Math.cos(r2));
            ang = Math.atan2(hy - cy, hx - cx);
            const nd = ang * 180 / Math.PI + sideOff;
            if (Math.abs(nd - headingDeg) < 1e-9) { headingDeg = nd; break; }
            headingDeg = nd;
        }
        const nx = hx - Math.cos(ang) * h;
        const ny = hy - Math.sin(ang) * h;
        marker._heading = headingDeg - mapRot;
        prevHD = headingDeg;
        const dx = nx - cx, dy = ny - cy;
        const dEast = (dx * Math.cos(R) + dy * Math.sin(R)) * mpp;
        const dNorth = (dx * Math.sin(R) - dy * Math.cos(R)) * mpp;
        marker._lat += dNorth / 111320;
        marker._lon += dEast / (111320 * Math.cos(marker._lat * Math.PI / 180));
        marker.update({ coordinates: [marker._lon, marker._lat] });
        updatePicMarker(marker);
        cx = nx; cy = ny;
    });

    const stop = e => {
        if (e.pointerId !== pid) return;
        pid = -1;
        if (active) {
            marker.update({ draggable: !(marker._panelOpen || drawMode || eraserMode) });
            map.update({ behaviors: (marker._panelOpen || drawMode || eraserMode) ? [] : appBehaviors });
            const moved = Math.abs(marker._lat - downLat) > 1e-12 || Math.abs(marker._lon - downLon) > 1e-12 ||
                Math.abs(((marker._heading - downHeading) % 360 + 540) % 360 - 180) > 1e-6;
            if (moved) commit();
        } else if (armed) {
            marker.update({ draggable: !(marker._panelOpen || drawMode || eraserMode) });
            if (!(marker._panelOpen || drawMode || eraserMode) && !anyPanelOpen()) map.update({ behaviors: appBehaviors });
        }
        armed = false; active = false;
    };
    window.addEventListener('pointerup', stop);
    window.addEventListener('pointercancel', stop);
}

function ensureIndicators(marker) {
    if (!marker._indicators) {
        marker._indicators = [];
        ['turn-left-top', 'turn-left-bottom', 'turn-right-top', 'turn-right-bottom'].forEach(cls => {
            const ind = document.createElement('div');
            ind.className = 'turn-indicator ' + cls;
            marker._rotWrap.appendChild(ind);
            marker._indicators.push(ind);
        });
        updatePicMarker(marker);
    }
}

function ensureControlButtons(marker) {
    if (marker._isTl) return;
    const wrap = marker._rotWrap;
    if (!marker._isZnak && !marker._leftBtn) {
        const mkBtn = (cls, arrow, side) => {
            const b = document.createElement('div');
            b.className = 'blink-btn ' + cls;
            b.innerHTML = arrow;
            b.addEventListener('pointerdown', e => {
                e.preventDefault();
                e.stopPropagation();
                setBlink(marker, side);
                if (marker._panelOpen) togglePanel(marker);
            });
            wrap.appendChild(b);
            return b;
        };
        marker._leftBtn = mkBtn('blink-left', '&#9664;', 'left');
        marker._rightBtn = mkBtn('blink-right', '&#9654;', 'right');
    }
    if (!marker._deleteBtn) {
        const del = document.createElement('div');
        del.className = 'delete-btn';
        del.innerHTML = '&#10005;';
        del.addEventListener('pointerdown', e => {
            e.preventDefault();
            e.stopPropagation();
            removeMarker(marker);
            commit();
        });
        wrap.appendChild(del);
        marker._deleteBtn = del;
    }
    updatePicMarker(marker);
}

// Ножка знака: добавить/убрать. Высота ножки = высоте знака (задаётся в updatePicMarker)
function toggleSignLeg(marker) {
    if (!marker || !marker._isZnak) return;
    if (marker._leg) {
        marker._leg.remove();
        marker._leg = null;
    } else {
        const leg = document.createElement('div');
        leg.className = 'sign-leg';
        marker._rotWrap.appendChild(leg);
        marker._leg = leg;
    }
    updatePicMarker(marker);
    updateSignalBtns();
    commit();
}

function removeMarker(marker) {
    if (marker._panelOpen) setPanel(marker, false);    if (activeCar === marker) setActiveCar(null);
    map.removeChild(marker);
    const idx = placedMarkers.indexOf(marker);
    if (idx !== -1) placedMarkers.splice(idx, 1);
}

function clearEverything() {
    if (drawMode) stopDraw();
    if (eraserMode) stopEraser();
    if (textMode) stopTextMode();
    else if (textEditing) commitTextEditing();
    drawing = false;
    drawFeature = null;
    lineCoords = [];
    lastDrawScreen = null;
    setActiveCar(null);
    drawnLines.forEach(line => { if (line.feature) map.removeChild(line.feature); });
    drawnLines = [];
    placedMarkers.slice().forEach(m => removeMarker(m));
    textItems.slice().forEach(m => removeTextItem(m));
    document.getElementById('picPanel').classList.remove('visible');
    document.getElementById('addPicBtn').classList.remove('open');
    document.getElementById('znakPanel').classList.remove('visible');
    document.getElementById('addZnakBtn').classList.remove('open');
    const tlPanel = document.getElementById('tlPanel');
    const tlBtn = document.getElementById('addTlBtn');
    if (tlPanel) tlPanel.classList.remove('visible');
    if (tlBtn) tlBtn.classList.remove('open');
    commit();
}

function setBlink(marker, side) {
    ensureIndicators(marker);
    const prev = marker._blinkSide;
    marker._blinkSide = (marker._blinkSide === side) ? null : side;
    if (marker._blinkSide !== prev) marker._blinkSince = performance.now();
    marker._rotWrap.classList.remove('signal-both');
    marker._rotWrap.classList.toggle('signal-left', marker._blinkSide === 'left');
    marker._rotWrap.classList.toggle('signal-right', marker._blinkSide === 'right');
    if (marker._leftBtn) marker._leftBtn.classList.toggle('active', marker._blinkSide === 'left');
    if (marker._rightBtn) marker._rightBtn.classList.toggle('active', marker._blinkSide === 'right');
    updateSignalBtns();
}

function setHazard(marker) {
    ensureIndicators(marker);
    const on = marker._blinkSide !== 'both';
    marker._blinkSide = on ? 'both' : null;
    if (marker._blinkSide) marker._blinkSince = performance.now();
    else marker._blinkSince = 0;
    marker._rotWrap.classList.toggle('signal-both', on);
    marker._rotWrap.classList.remove('signal-left', 'signal-right');
    if (marker._leftBtn) marker._leftBtn.classList.remove('active');
    if (marker._rightBtn) marker._rightBtn.classList.remove('active');
    updateSignalBtns();
}

function anyPanelOpen() {
    return placedMarkers.some(m => m._panelOpen);
}

function setPanel(marker, open) {
    if (marker._isTl) { if (window.setTlPanel) window.setTlPanel(marker, open); return; }
    ensureControlButtons(marker);
    marker._panelOpen = open;
    marker._rotWrap.classList.toggle('panel-open', marker._panelOpen);
    marker.update({ draggable: !(marker._panelOpen || drawMode || eraserMode) });
    map.update({ behaviors: anyPanelOpen() ? [] : appBehaviors });
}

function togglePanel(marker) {
    setPanel(marker, !marker._panelOpen);
}

function setupMarkerLongPress(marker) {
    const el = marker._select;
    el.addEventListener('pointerdown', e => {
        if (drawMode || eraserMode) return;
        if (e.target.closest && (e.target.closest('.blink-btn') || e.target.closest('.delete-btn') || e.target.closest('.tl-ctrl'))) return;
        const lpId = e.pointerId;
        const sx = e.clientX, sy = e.clientY;
        let timer = null;
        const clearTimer = () => { if (timer) { clearTimeout(timer); timer = null; } };
        const onMove = ev => {
            if (ev.pointerId !== lpId) return;
            if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > LP_MOVE_TOLERANCE_PX) clearTimer();
        };
        const end = ev => {
            if (ev.pointerId !== lpId) return;
            clearTimer();
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', end);
            window.removeEventListener('pointercancel', end);
        };
        timer = setTimeout(() => {
            timer = null;
            togglePanel(marker);
        }, LP_DURATION_MS);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', end);
        window.addEventListener('pointercancel', end);
    });
}

// Метры на пиксель (Web Mercator, тайлы 256px)
function metersPerPixel(lat) {
    const zoom = map.zoom || 0;
    return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
}


// Перемещение машинок касанием по телу убрано: перетаскивание теперь
// начинается только с фиксации на границе изображения (см. setupTopDrag).

let mapRot = 0;
// pinchRotate отключён: вращение двумя пальцами реализовано кастомно (см. initCustomPinchRotate)
let appBehaviors = ['drag', 'scrollZoom', 'dblClick', 'pinchZoom', 'pinchTilt', 'mouseTilt', 'mouseRotate'];

function updatePicMarker(marker) {
    if (!marker) return;
    if (marker._isTl) { if (window.updateTlMarker) window.updateTlMarker(marker); return; }
    if (!marker._img) return;
    const mpp = metersPerPixel(marker._lat);
    if (!mpp) return;
    let imgH;
    if (marker._isZnak) {
        const realH = (marker._sizeM || ZNAK_WIDTH_M) / mpp;
        imgH = Math.max(15, realH);
        marker._img.style.width = imgH + 'px';
        marker._img.style.height = imgH + 'px';
        if (marker._leg) {
            // Ножка длиннее знака: верхние 35% прячутся под знак (ножка на слое позади).
            // Ножка считается от РЕАЛЬНОГО размера знака (не ограниченного минимумом 15px),
            // чтобы она всегда уменьшалась вместе с масштабом карты.
            const legH = realH || imgH;
            const overlap = legH * 0.35;
            marker._leg.style.top = (legH - overlap) + 'px';
            marker._leg.style.height = (legH + overlap) + 'px';
            marker._leg.style.width = (legH * 0.09) + 'px';
        }
    } else {
        imgH = (marker._sizeM || PIC_SIZE_M) / mpp;
        marker._img.style.height = imgH + 'px';
    }
    marker._rotWrap.style.transform = `translate(-50%,-50%) rotate(${marker._heading + mapRot}deg)`;
    if (marker._indicators) {
        const s = (TURN_IND_SIZE_M / mpp) + 'px';
        marker._indicators.forEach(ind => {
            ind.style.width = s;
            ind.style.height = s;
        });
    }
}

function updateAllPicMarkers(event) {
    if (event && event.camera && event.camera.azimuth !== undefined) mapRot = event.camera.azimuth * 180 / Math.PI;
    placedMarkers.forEach(updatePicMarker);
    positionAllText();
}

// Кастомный пинч-поворот карты двумя пальцами: штатный pinchRotate отключён,
// азимут задаётся напрямую по углу между пальцами — без привязки к фиксированным углам.
function initCustomPinchRotate() {
    const el = document.getElementById('map');
    let baseAngle = null, baseAzimuth = 0;
    const pair = e => e.touches.length >= 2 ? [e.touches[0], e.touches[1]] : null;
    const angleOf = (a, b) => Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX);
    const norm = a => {
        while (a > Math.PI) a -= 2 * Math.PI;
        while (a < -Math.PI) a += 2 * Math.PI;
        return a;
    };
    el.addEventListener('touchstart', e => {
        const t = pair(e);
        if (!t || drawMode || eraserMode || anyPanelOpen()) return;
        baseAngle = angleOf(t[0], t[1]);
        baseAzimuth = map.azimuth;
    }, { passive: true });
    el.addEventListener('touchmove', e => {
        if (baseAngle == null) return;
        const t = pair(e);
        if (!t) return;
        const d = norm(angleOf(t[0], t[1]) - baseAngle);
        map.update({ camera: { azimuth: baseAzimuth + d } });
    }, { passive: true });
    ['touchend', 'touchcancel'].forEach(ev =>
        el.addEventListener(ev, e => {
            if (e.touches.length < 2) baseAngle = null;
        }, { passive: true }));
}

    const ROTATE_STEP = 5 * Math.PI / 180;
    const ROTATE_HOLD_STEP = 1 * Math.PI / 180;
    const ROTATE_HOLD_MS = 1000;
    const ROTATE_HOLD_INTERVAL = 100;

    function setupRotateBtn(btnId, dir) {
        const btn = document.getElementById(btnId);
        let holdTimer = null;
        let longFired = false;
        let raf = null;

        const rotateBy = (angle, duration) => map.update({ camera: { azimuth: map.azimuth + dir * angle, duration } });

        const spin = () => {
            rotateBy(ROTATE_HOLD_STEP, 100);
            raf = setTimeout(spin, ROTATE_HOLD_INTERVAL);
        };

        btn.addEventListener('pointerdown', () => {
            longFired = false;
            holdTimer = setTimeout(() => {
                longFired = true;
                spin();
            }, ROTATE_HOLD_MS);
        });

        const stop = () => {
            clearTimeout(holdTimer);
            holdTimer = null;
            clearTimeout(raf);
            raf = null;
        };

        btn.addEventListener('pointerup', stop);
        btn.addEventListener('pointercancel', stop);

        btn.addEventListener('click', () => {
            if (longFired) { longFired = false; return; }
            rotateBy(ROTATE_STEP, 200);
        });
    }

    setupRotateBtn('rotCCWBtn', -1);
    setupRotateBtn('rotCWBtn', +1);

    let pddStack = [{ type: 'sections' }];

    const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function pddSearchEntries(q) {
        const low = q.toLowerCase();
        if (!low) return [];
        const out = [];
        PDD_DATA.forEach(sec => {
            const matches = [];
            sec.entries.forEach(entry => {
                if (entry.group) return;
                const hay = (entry.num + ' ' + entry.text).toLowerCase();
                if (hay.includes(low)) matches.push(entry);
            });
            if (matches.length) out.push({ sec, matches });
        });
        return out;
    }

    function pddSnippet(text, query) {
        const low = query.toLowerCase();
        const textLow = text.toLowerCase();
        const idx = textLow.indexOf(low);
        const start = Math.max(0, idx - 60);
        const end = Math.min(text.length, (idx === -1 ? 0 : idx) + Math.max(low.length, 0) + 140);
        let s = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
        s = escapeHtml(s);
        if (low) s = s.replace(new RegExp('(' + escapeRegExp(query) + ')', 'gi'), '<mark>$1</mark>');
        return s;
    }

    function pddHighlightFull(text, query) {
        let s = escapeHtml(text);
        if (query) s = s.replace(new RegExp('(' + escapeRegExp(query) + ')', 'gi'), '<mark>$1</mark>');
        return s;
    }

    function pddRender() {
        const body = document.getElementById('pddBody');
        const v = pddStack[pddStack.length - 1];
        document.getElementById('pddTitle').textContent = v.type === 'sections' ? 'ПДД РФ' : v.type === 'items' ? v.sec.title : v.type === 'search' ? 'Поиск: «' + v.query + '»' : 'Пункт ' + v.entry.num;
        document.getElementById('pddBack').style.visibility = pddStack.length > 1 ? 'visible' : 'hidden';
        body.innerHTML = '';
        if (v.type === 'sections') {
            PDD_DATA.forEach(sec => {
                const row = document.createElement('div');
                row.className = 'pdd-row';
                row.textContent = sec.title;
                row.addEventListener('click', () => { pddStack.push({ type: 'items', sec }); pddRender(); });
                body.appendChild(row);
            });
        } else if (v.type === 'items') {
            v.sec.entries.forEach(entry => {
                if (entry.group) {
                    const g = document.createElement('div');
                    g.className = 'pdd-group';
                    g.textContent = entry.group;
                    body.appendChild(g);
                    return;
                }
                const row = document.createElement('div');
                row.className = 'pdd-row';
                const num = document.createElement('span');
                num.className = 'pdd-row-num';
                num.textContent = entry.num + '.';
                const prev = document.createElement('span');
                prev.className = 'pdd-row-prev';
                prev.textContent = entry.text;
                row.appendChild(num);
                row.appendChild(prev);
                row.addEventListener('click', () => { pddStack.push({ type: 'text', sec: v.sec, entry }); pddRender(); });
                body.appendChild(row);
            });
        } else if (v.type === 'search') {
            const results = pddSearchEntries(v.query);
            if (!results.length) {
                const e = document.createElement('div');
                e.className = 'pdd-empty';
                e.textContent = 'Ничего не найдено';
                body.appendChild(e);
            } else {
                results.forEach(({ sec, matches }) => {
                    const g = document.createElement('div');
                    g.className = 'pdd-group';
                    g.textContent = sec.title;
                    body.appendChild(g);
                    matches.forEach(entry => {
                        const row = document.createElement('div');
                        row.className = 'pdd-row';
                        const num = document.createElement('span');
                        num.className = 'pdd-row-num';
                        num.textContent = entry.num + '.';
                        const prev = document.createElement('span');
                        prev.className = 'pdd-row-prev';
                        prev.innerHTML = pddSnippet(entry.text, v.query);
                        row.appendChild(num);
                        row.appendChild(prev);
                        row.addEventListener('click', () => { pddStack.push({ type: 'text', sec, entry, query: v.query }); pddRender(); });
                        body.appendChild(row);
                    });
                });
            }
        } else {
            const t = document.createElement('div');
            t.className = 'pdd-text';
            const num = document.createElement('span');
            num.className = 'pdd-row-num';
            num.textContent = v.entry.num + '.';
            t.appendChild(num);
            if (v.query) {
                const txt = document.createElement('span');
                txt.innerHTML = pddHighlightFull(v.entry.text, v.query);
                t.appendChild(txt);
                body.appendChild(t);
                requestAnimationFrame(() => {
                    const mark = t.querySelector('mark');
                    if (mark) mark.scrollIntoView({ block: 'center' });
                });
            } else {
                const txt = document.createElement('span');
                txt.textContent = v.entry.text;
                t.appendChild(txt);
                body.appendChild(t);
            }
        }
        body.scrollTop = 0;
    }

    const pddBtn = document.getElementById('pddBtn');
    const pddModal = document.getElementById('pddModal');
    const togglePdd = () => {
        const open = !pddModal.classList.contains('visible');
        pddModal.classList.toggle('visible', open);
        pddBtn.classList.toggle('active', open);
        document.body.classList.toggle('pdd-open', open);
        if (open) { pddStack = [{ type: 'sections' }]; document.getElementById('pddSearch').value = ''; setSearchVisible(false); pddRender(); }
        placeGalleryAbove();
    };
    // Долгое нажатие на кнопку ПДД: скрыть/вернуть все элементы управления
    let pddLpTimer = null, pddLpFired = false;
    const pddLpClear = () => { if (pddLpTimer) { clearTimeout(pddLpTimer); pddLpTimer = null; } };
    pddBtn.addEventListener('pointerdown', () => {
        pddLpFired = false;
        pddLpTimer = setTimeout(() => {
            pddLpTimer = null;
            pddLpFired = true;
            document.body.classList.toggle('controls-hidden');
            // при скрытии закрываем шторку и все панели
            if (document.body.classList.contains('controls-hidden')) {
                if (pddModal.classList.contains('visible')) togglePdd();
                ['picPanel', 'znakPanel', 'tlPanel'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.remove('visible');
                });
                document.getElementById('addPicBtn').classList.remove('open');
                document.getElementById('addZnakBtn').classList.remove('open');
                const tlb = document.getElementById('addTlBtn');
                if (tlb) tlb.classList.remove('open');
            }
        }, 500);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => pddBtn.addEventListener(ev, pddLpClear));
    pddBtn.addEventListener('click', () => {
        if (pddLpFired) { pddLpFired = false; return; } // это был long-press — не открываем шторку
        togglePdd();
    });
    document.getElementById('pddClose').addEventListener('click', togglePdd);
    document.getElementById('pddBack').addEventListener('click', () => {
        if (pddStack[pddStack.length - 1].type === 'search') { exitSearch(); return; }
        if (pddStack.length > 1) { pddStack.pop(); pddRender(); }
        else togglePdd();
    });

    const pddSearchInput = document.getElementById('pddSearch');
    const pddSearchBox = document.querySelector('.pdd-search');
    const pddSearchBtn = document.getElementById('pddSearchBtn');
    const setSearchVisible = (v) => {
        pddSearchBox.classList.toggle('visible', v);
        pddSearchBtn.classList.toggle('active', v);
        if (v) pddSearchInput.focus();
    };
    const exitSearch = () => {
        pddSearchInput.value = '';
        setSearchVisible(false);
        const si = pddStack.findIndex(x => x.type === 'search');
        if (si !== -1) { pddStack = pddStack.slice(0, si); pddRender(); }
    };
    pddSearchBtn.addEventListener('click', () => {
        if (pddSearchBox.classList.contains('visible')) exitSearch();
        else setSearchVisible(true);
    });
    pddSearchInput.addEventListener('input', () => {
        const q = pddSearchInput.value.trim().replace(/\s+/g, ' ');
        const top = pddStack[pddStack.length - 1];
        if (!q) {
            if (top.type === 'search') { pddStack.pop(); pddRender(); }
            return;
        }
        if (top.type === 'search') {
            if (top.query !== q) { top.query = q; pddRender(); }
        } else {
            pddStack.push({ type: 'search', query: q });
            pddRender();
        }
    });

    const pddHeader = document.querySelector('.pdd-header');
    let pddDrag = null;
    pddHeader.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.pdd-nav')) return;
        document.body.classList.add('pdd-drag');
        pddDrag = { startY: e.clientY, startH: pddModal.offsetHeight };
        pddHeader.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    const galleryBtn = document.getElementById('addPicBtn');
    const galleryPanel = document.getElementById('picPanel');
    const znakBtn = document.getElementById('addZnakBtn');
    const znakPanelEl = document.getElementById('znakPanel');
    function placeGalleryAbove() {
        // Кнопка/панель светофора создаются в trafficlights.js позже — ищем на момент вызова
        const tlBtn = document.getElementById('addTlBtn');
        const tlPanelEl = document.getElementById('tlPanel');
        const historyBtn = document.getElementById('historyBtn');
        if (document.body.classList.contains('pdd-open')) {
            const h = pddModal.offsetHeight + 12;
            galleryBtn.style.bottom = h + 'px';
            galleryPanel.style.bottom = h + 'px';
            znakBtn.style.bottom = (h + 64) + 'px';
            znakPanelEl.style.bottom = h + 'px';
            if (tlBtn) tlBtn.style.bottom = (h + 128) + 'px';
            if (tlPanelEl) tlPanelEl.style.bottom = h + 'px';
            if (historyBtn) historyBtn.style.bottom = h + 'px';
        } else {
            galleryBtn.style.bottom = '';
            galleryPanel.style.bottom = '';
            znakBtn.style.bottom = '';
            znakPanelEl.style.bottom = '';
            if (tlBtn) tlBtn.style.bottom = '';
            if (tlPanelEl) tlPanelEl.style.bottom = '';
            if (historyBtn) historyBtn.style.bottom = '';
        }
    }
    pddHeader.addEventListener('pointermove', (e) => {
        if (!pddDrag) return;
        const h = pddDrag.startH + (pddDrag.startY - e.clientY);
        const vh = window.innerHeight;
        pddModal.style.height = Math.min(vh, Math.max(vh * 0.15, h)) + 'px';
        placeGalleryAbove();
    });
    const endPddDrag = () => { pddDrag = null; document.body.classList.remove('pdd-drag'); };
    pddHeader.addEventListener('pointerup', endPddDrag);
    pddHeader.addEventListener('pointercancel', endPddDrag);

    document.getElementById('addPicBtn').addEventListener('click', () => {
        if (drawMode) stopDraw();
        if (eraserMode) stopEraser();
        if (textMode) stopTextMode();
        const panel = document.getElementById('picPanel');
        panel.classList.toggle('visible');
        document.getElementById('addPicBtn').classList.toggle('open', panel.classList.contains('visible'));
        if (panel.classList.contains('visible')) {
            // Сетка строится один раз при старте; пересоздание заставляет картинки мигать
            if (!document.getElementById('picGrid').children.length) buildPicGrid();
            const znakPanel = document.getElementById('znakPanel');
            znakPanel.classList.remove('visible');
            document.getElementById('addZnakBtn').classList.remove('open');
            const tlPanel = document.getElementById('tlPanel');
            if (tlPanel) { tlPanel.classList.remove('visible'); }
            const tlBtn = document.getElementById('addTlBtn');
            if (tlBtn) tlBtn.classList.remove('open');
        }
    });

    document.getElementById('addZnakBtn').addEventListener('click', () => {
        if (drawMode) stopDraw();
        if (eraserMode) stopEraser();
        if (textMode) stopTextMode();
        const panel = document.getElementById('znakPanel');
        panel.classList.toggle('visible');
        document.getElementById('addZnakBtn').classList.toggle('open', panel.classList.contains('visible'));
        if (panel.classList.contains('visible')) {
            if (!document.getElementById('znakGrid').children.length) buildZnakGrid();
            if (window.updateZnakScrollbar) setTimeout(window.updateZnakScrollbar, 50);
            const picPanel = document.getElementById('picPanel');
            picPanel.classList.remove('visible');
            document.getElementById('addPicBtn').classList.remove('open');
            const tlPanel = document.getElementById('tlPanel');
            if (tlPanel) { tlPanel.classList.remove('visible'); }
            const tlBtn = document.getElementById('addTlBtn');
            if (tlBtn) tlBtn.classList.remove('open');
        }
    });

    const tlToggleBtn = document.getElementById('addTlBtn');
    if (tlToggleBtn) tlToggleBtn.addEventListener('click', () => {
        if (drawMode) stopDraw();
        if (eraserMode) stopEraser();
        if (textMode) stopTextMode();
        const panel = document.getElementById('tlPanel');
        panel.classList.toggle('visible');
        tlToggleBtn.classList.toggle('open', panel.classList.contains('visible'));
        if (panel.classList.contains('visible')) {
            if (window.buildTlGrid) window.buildTlGrid();
            document.getElementById('picPanel').classList.remove('visible');
            document.getElementById('addPicBtn').classList.remove('open');
            document.getElementById('znakPanel').classList.remove('visible');
            document.getElementById('addZnakBtn').classList.remove('open');
        }
    });

    buildPicGrid();
    buildZnakGrid();
    initZnakScrollbar();
    // iOS: гасим нативный скролл на элементах галерей, иначе он обгоняет drag
    // и приходит pointercancel — вместо перетаскивания листается панель
    ['picGrid', 'znakGrid'].forEach(id => {
        const g = document.getElementById(id);
        g.addEventListener('touchstart', e => {
            if (e.target.closest && e.target.closest('.pic-item')) e.preventDefault();
        }, { passive: false });
    });
    document.getElementById('addPicThumb').src = 'pic/' + encodeURIComponent(PIC_FILES[0]);
    document.getElementById('addZnakThumb').src = 'znaki/' + encodeURIComponent(ZNAKI_FILES[0]);
    document.querySelector('.color-btn[data-color="#000000"]').classList.add('active');
    commit();
    document.getElementById('loading').classList.add('hidden');
})();
</script>
<script>
// Запрет встроенного зума браузера (iOS Safari игнорирует user-scalable=no).
// Зум карты работает через touch-события и не затрагивается.
['gesturestart', 'gesturechange'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
</script>
<script src="padtext.js"></script>
<script src="recplay.js"></script>
<script src="trafficlights.js"></script>
<script src="saveState.js"></script>
<script>
// Обработка deep-link: сцена по ссылке t.me/E_ia_bot/pad?startapp=<payload>.
// payload — base64url(ownerUserId:sceneName). Загружаем чужую сцену напрямую.
(function () {
    function b64urlDecode(s) {
        if (!s) return null;
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        try {
            return decodeURIComponent(escape(atob(s)));
        } catch (e) { return null; }
    }

    function handleStartParam() {
        const wa = window.Telegram && window.Telegram.WebApp;
        const param = wa && wa.initDataUnsafe && wa.initDataUnsafe.start_param;
        if (!param) return;
        const decoded = b64urlDecode(param);
        if (!decoded) return;
        const idx = decoded.indexOf(':');
        if (idx === -1) return;
        const ownerUserId = decoded.slice(0, idx);
        const sceneName = decoded.slice(idx + 1);
        if (!ownerUserId || !sceneName) return;
        if (!window.loadSharedScene) return;
        // Ждём готовности карты
        if (window.map) {
            window.loadSharedScene(ownerUserId, sceneName);
        } else {
            const t = setInterval(() => {
                if (window.map) { clearInterval(t); window.loadSharedScene(ownerUserId, sceneName); }
            }, 500);
        }
    }
    handleStartParam();
})();
</script>
